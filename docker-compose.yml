services:
  backend:
    build: ./backend
    container_name: skyping-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data      # SQLite file vive acá, persiste reinicios
    env_file:
      - ./backend/.env                # SENTINEL_CLIENT_ID / SENTINEL_CLIENT_SECRET
    environment:
      - PYTHONUNBUFFERED=1
      - SKYPING_DB_PATH=/app/data/skyping.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    container_name: skyping-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
